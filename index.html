<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albedo</title>
    <!--
      Splash. The window opens before the app's JavaScript has loaded and run,
      which took a second or two of blank window. This paints at once and React
      replaces it on its first render (it lives inside #root), so nothing has
      to remove it.

      It cannot use styles.css, which only arrives with the bundle, so the two
      grounds are repeated here: they are --bg for light and dark in
      src/styles.css and must match it, or the hand-over flashes. The theme
      choice is read the way src/ui/theme.ts reads it, before the first paint.
    -->
    <script>
      try {
        var t = localStorage.getItem('albedo.shell.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Scoped to .splash only: these rules outlive the splash, and on body
         they would outrank styles.css for the rest of the session. */
      .splash {
        position: fixed;
        inset: 0;
        background: #f6f6f7;
        color: #08090b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.02em;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .splash { background: #0e0f11; color: #f7f7f8; }
      }
      :root[data-theme='dark'] .splash { background: #0e0f11; color: #f7f7f8; }
      .splash img { width: 96px; height: 96px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Albedo is starting">
        <img src="/src-tauri/icons/128x128@2x.png" alt="" />
        <div>Albedo</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
