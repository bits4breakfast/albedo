[package]
name = "albedo-mcp"
version = "0.1.0"
license = "MIT"
description = "The stdio MCP server Albedo gives every session it starts (#157)"
edition = "2021"
rust-version = "1.77"
publish = false

# A separate crate, not a bin target of the app: its dependency list is its
# own, so it stays this one line, and the binary links nothing of Tauri or
# WebKit -- Claude Code starts one per session, and it should cost nothing.
[dependencies]
serde_json = "1"
