[package]
name = "albedo"
version = "0.1.0"
license = "MIT"
description = "Personal desktop cockpit for running multiple Claude Code sessions"
edition = "2021"
rust-version = "1.77"

# The app, and the MCP server it bundles beside itself (mcp/, #157). One
# workspace so both share Cargo.lock and target/: `cargo build -p albedo-mcp`
# puts the server next to the app's own binary, where a dev build finds it.
[workspace]
members = [".", "mcp"]

[lib]
name = "albedo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# `watch` is NOT a default feature of tauri-plugin-fs: without it the plugin
# never registers the `watch` command and every call fails at runtime with
# "Command watch not found". Capabilities are not enough -- `fs:allow-watch`
# grants permission for a command that does not exist.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Pinned to the minor of @tauri-apps/plugin-notification: the CLI refuses a
# JS/Rust minor mismatch (scripts/check-tauri-versions.mjs).
tauri-plugin-notification = "~2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.23"
parking_lot = "0.13"
# killpg/poll/dup for the pty bridge. Already in the tree via portable-pty.
libc = "0.2"

# attention.rs: banners through UNUserNotificationCenter, and a dock bounce
# that stops on its own. All already in the tree via tauri; listed here so
# attention.rs can name them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-user-notifications = { version = "0.3", features = ["block2"] }

[dev-dependencies]
# Only for fsscope's tests, to match a scope pattern with the plugin's options.
# Already in the tree via tauri.
glob = "0.3"
