[package]
name = "albedo"
version = "0.1.0"
description = "Personal desktop cockpit for running multiple Claude Code sessions"
edition = "2021"
rust-version = "1.77"

[lib]
name = "albedo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# `watch` is NOT a default feature of tauri-plugin-fs: without it the plugin
# never registers the `watch` command and every call fails at runtime with
# "Command watch not found". Capabilities are not enough -- `fs:allow-watch`
# grants permission for a command that does not exist.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Pinned to 2.4.x: 2.5+ requires @tauri-apps/api 2.12 on the JS side, and the
# tauri crate here is 2.11 -- the CLI refuses a JS/Rust minor mismatch.
tauri-plugin-notification = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
parking_lot = "0.12"
# killpg/poll/dup for the pty bridge. Already in the tree via portable-pty.
libc = "0.2"
