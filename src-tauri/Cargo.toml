[package]
name = "albedo"
version = "0.1.0"
description = "Personal desktop cockpit for running multiple Claude Code sessions"
edition = "2021"
rust-version = "1.77"

[lib]
name = "albedo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
parking_lot = "0.12"
